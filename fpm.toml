name = "HeatFlow"
version = "2.1.0"
license = "GPLv3"
author = "HeatFlow maintainers"
maintainer = ""
description = "A Fortran executable for modelling Cattaneo heat flow"

[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]

[dependencies]
mpi = "*"

[features]
petsc.build.external-modules = ["petscksp"]
petsc.build.link = ["petsc"]
# PETSc include/library paths are provided at build time (see build_fpm_with_petsc.sh)
petsc.flags = "-DHAVE_PETSC"

[profiles]
default = ["petsc"]

[library]
source-dir="src"

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"

[[executable]]
name="HeatFlow"
source-dir="src"
main="heatflow.f90"
