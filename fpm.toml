name = "HeatFlow"
version = "2.1.0"
license = "GPLv3"
author = "HeatFlow maintainers"
maintainer = ""
description = "A Fortran executable for modelling Cattaneo heat flow"

[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]

[dependencies]
mpi = "*"

# PETSc, HDF5 and BLAS/LAPACK are optional external dependencies.  fpm cannot
# auto-detect them from the manifest, so use the build_fpm*.sh wrapper scripts
# in the repository root to enable them.
[build]
external-modules = ["hdf5", "petscksp"]

[library]
source-dir="src"

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"

[[executable]]
name="HeatFlow"
source-dir="src"
main="heatflow.f90"
